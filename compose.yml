services:
  notes:
    build: .
    image: notes:1.0
    restart: unless-stopped
    environment:
      PORT: "8080"
      NOTES_FILE: /data/notes.txt
    volumes:
      - notes-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 2s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  nginx:
    image: nginx:1.31.4
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/notes-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      notes:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes_dev_password
      POSTGRES_DB: notes
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 10s
      retries: 5

volumes:
  notes-data:
  db-data:
