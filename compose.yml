services:
     notes:
       build: .
       container_name: notes
       ports: ["8080:8080"]
       environment:
         PORT: "8080"
         NOTES_FILE: /data/notes.txt
       volumes:
         - notes-data:/data
       restart: unless-stopped
       healthcheck:
         test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
         interval: 10s
         timeout: 2s
         retries: 3
       networks:
         - monitoring-net

     prometheus:
       image: prom/prometheus:v3.1.0
       container_name: prometheus
       ports: ["9090:9090"]
       volumes:
         - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
         - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
         - ./monitoring/rules:/rules
         - prom_data:/prometheus
       command:
         - "--config.file=/etc/prometheus/prometheus.yml"
         - "--web.enable-lifecycle"
         - "--enable-feature=otlp-write-receiver"
       restart: unless-stopped
       depends_on:
         - notes
       networks:
         - monitoring-net

     grafana:
       image: grafana/grafana:11.4.0
       container_name: grafana
       ports: ["3000:3000"]
       environment:
         GF_SECURITY_ADMIN_PASSWORD: admin
       volumes:
         - grafana_data:/var/lib/grafana
       restart: unless-stopped
       networks:
         - monitoring-net

     loki:
       image: grafana/loki:3.3.0
       container_name: loki
       ports: ["3100:3100"]
       command: -config.file=/etc/loki/local-config.yaml
       restart: unless-stopped
       networks:
         - monitoring-net

     alloy:
       image: grafana/alloy:v1.5.0
       container_name: alloy
       volumes:
         - ./monitoring/alloy-config.river:/etc/alloy/config.river
         - /var/log:/var/log:ro
       command:
         - run
         - --server.http.listen-addr=0.0.0.0:12345
         - /etc/alloy/config.river
       restart: unless-stopped
       networks:
         - monitoring-net

     node-exporter:
       image: prom/node-exporter:v1.8.2
       container_name: node-exporter
       ports: ["9100:9100"]
       pid: host
       volumes:
         - /proc:/host/proc:ro
         - /sys:/host/sys:ro
       command:
         - "--path.procfs=/host/proc"
         - "--path.sysfs=/host/sys"
       restart: unless-stopped
       networks:
         - monitoring-net

     alertmanager:
       image: prom/alertmanager:v0.28.0
       container_name: alertmanager
       ports: ["9093:9093"]
       volumes:
         - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
       command:
         - '--config.file=/etc/alertmanager/alertmanager.yml'
         - '--cluster.listen-address='
       restart: unless-stopped
       networks:
         - monitoring-net

     tempo:
       image: grafana/tempo:2.6.1
       container_name: tempo
       ports: ["3200:3200", "4317:4317"]
       command: ["-config.file=/etc/tempo.yaml"]
       volumes:
         - ./monitoring/tempo.yaml:/etc/tempo.yaml
       restart: unless-stopped
       networks:
         - monitoring-net

volumes:
  prom_data:
  grafana_data:
  notes-data:

networks:
  monitoring-net:
    driver: bridge
