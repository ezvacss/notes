name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: installing python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: checking app syntax
        run: python -m py_compile app.py

      - name: checking code style
        run: |
          pip install ruff
          ruff check app.py

      - name: check that service is responding
        run: |
          PORT=8080 python app.py &
          sleep 2
          curl --fail --silent http://localhost:8080/healthz
          echo "healthcheck прошёл"

      - name: checking nginx config
        run: |
          sudo apt-get update && sudo apt-get install -y nginx

          sudo mkdir -p /etc/nginx/tls
          sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /etc/nginx/tls/notes.key \
            -out /etc/nginx/tls/notes.crt \
            -subj "/CN=notesApp.test"

          sudo cp deploy/notesApp.conf /etc/nginx/conf.d/
          sudo nginx -t
