- name: Deploy the Notes service
  hosts: notes
  become: true

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Gather facts now that the host is reachable
      ansible.builtin.setup:

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker's apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Pull application code
      ansible.builtin.git:
        repo: https://github.com/ezvacss/notes.git
        dest: /opt/notes
        version: main
      register: repo

    - name: Bring up the stack via Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /opt/notes
      when: repo.changed

    - name: Wait until the app responds
      ansible.builtin.uri:
        url: http://localhost:8080/healthz
        status_code: 200
      register: health
      until: health.status == 200
      retries: 12
      delay: 5
